<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抛物线弹道射击模拟器 · Week 06</title>
<style>
  :root{
    --bg:       #1a1a24;   /* 深灰科技底色（与第 05 周保持一致） */
    --line:     rgba(120,180,255,.16);
    --fg:       #c9d6e8;
    --dim:      #6b7a92;
    --accent:   #4ea8ff;
    --accent2:  #7ef0d0;
    --warm:     #ff9a50;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,"Microsoft YaHei",monospace;
    color:var(--fg); font-size:13px;
    -webkit-font-smoothing:antialiased;
  }

  #stage{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  #stage.aiming{ cursor:grabbing; }

  .panel{
    background:rgba(22,22,32,.76);
    border:1px solid var(--line);
    border-radius:10px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 34px rgba(0,0,0,.5);
  }

  /* ---------- 左上角数据面板 ---------- */
  #hud{ position:fixed; top:20px; left:20px; padding:13px 16px; min-width:272px; }
  #hud h1{
    font-size:11px; font-weight:600; letter-spacing:.2em;
    color:var(--accent); text-transform:uppercase;
    padding-bottom:8px; margin-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .row{ display:flex; justify-content:space-between; align-items:baseline; gap:18px; line-height:1.82; }
  .row .k{ color:var(--dim); font-size:12px; white-space:nowrap; }
  .row .v{ color:var(--fg); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row .v.hl{ color:var(--accent2); }
  .row .v.hit{ color:var(--warm); }
  .hr{ height:1px; background:var(--line); margin:7px 0; }

  /* ---------- 底部控制面板 ---------- */
  #ctrl{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:9px;
    padding:11px 16px; max-width:calc(100vw - 32px);
  }
  .ctrlRow{ display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
  .paramRow{
    display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;
    padding-top:9px; border-top:1px solid var(--line);
  }

  button{
    font:inherit; font-size:12px; color:var(--fg);
    background:rgba(78,168,255,.10);
    border:1px solid rgba(78,168,255,.34);
    border-radius:7px; padding:6px 14px; cursor:pointer;
    transition:background .16s, border-color .16s, color .16s;
  }
  button:hover{ background:rgba(78,168,255,.22); border-color:rgba(78,168,255,.6); }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  #btnFire{
    background:rgba(255,154,80,.14);
    border-color:rgba(255,154,80,.45);
    color:#ffcda6; font-weight:600; letter-spacing:.05em;
  }
  #btnFire:hover:not(:disabled){ background:rgba(255,154,80,.28); border-color:rgba(255,154,80,.8); }

  .group{ display:flex; align-items:center; gap:8px; }
  .group > span{ color:var(--dim); font-size:12px; white-space:nowrap; }
  .paramRow .group > span{ min-width:58px; }
  .paramRow output{ min-width:64px; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100px; height:3px; border-radius:2px;
    background:rgba(120,180,255,.24); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 10px rgba(78,168,255,.85); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border:0; border-radius:50%;
    background:var(--accent); box-shadow:0 0 10px rgba(78,168,255,.85); cursor:pointer;
  }
  output{ color:var(--accent2); font-variant-numeric:tabular-nums; min-width:40px; }

  .hint{
    color:var(--dim); font-size:11.5px;
    padding-left:12px; border-left:1px solid var(--line);
  }

  @media (max-width:900px){
    #hud{ min-width:0; padding:10px 12px; }
    #ctrl{ bottom:10px; gap:7px; padding:8px 11px; }
    .ctrlRow{ gap:9px; }
    .paramRow{ gap:12px; }
    .hint{ display:none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<!-- ================= 实时数据面板 ================= -->
<div id="hud" class="panel">
  <h1>Week 06 · 弹道射击仿真</h1>
  <div class="row"><span class="k">初速度 v₀</span><span class="v hl" id="v-v0">—</span></div>
  <div class="row"><span class="k">发射角 θ</span><span class="v hl" id="v-theta">—</span></div>
  <div class="row"><span class="k">靶距 D</span><span class="v" id="v-D">—</span></div>
  <div class="row"><span class="k">空气阻力 k</span><span class="v" id="v-k">—</span></div>
  <div class="hr"></div>
  <div class="row"><span class="k">理论射程 R₀</span><span class="v" id="v-r0">—</span></div>
  <div class="row"><span class="k">飞行时间 t</span><span class="v" id="v-t">—</span></div>
  <div class="row"><span class="k">最大高度</span><span class="v" id="v-apex">—</span></div>
  <div class="row"><span class="k">实际射程</span><span class="v" id="v-range">—</span></div>
  <div class="hr"></div>
  <div class="row"><span class="k">本次结果</span><span class="v" id="v-state">—</span></div>
  <div class="row"><span class="k">射击次数 n</span><span class="v" id="v-n">—</span></div>
  <div class="row"><span class="k">命中率</span><span class="v" id="v-rate">—</span></div>
  <div class="row"><span class="k">平均偏差 μ</span><span class="v" id="v-mu">—</span></div>
  <div class="row"><span class="k">偏差标准差 σ</span><span class="v" id="v-sigma">—</span></div>
  <div class="row"><span class="k">最佳环数</span><span class="v" id="v-best">—</span></div>
</div>

<!-- ================= 控制面板 ================= -->
<div id="ctrl" class="panel">
  <div class="ctrlRow">
    <button id="btnFire">发 射</button>
    <button id="btnClear">清空统计</button>
    <span class="hint">拖拽画布瞄准并发射 · 空格 发射 · C 清空</span>
  </div>

  <div class="paramRow">
    <div class="group">
      <span>初速度</span>
      <input id="pV0" type="range" min="10" max="45" step="0.5" value="30">
      <output id="oV0">30.0 m/s</output>
    </div>
    <div class="group">
      <span>发射角</span>
      <input id="pTh" type="range" min="0" max="85" step="0.1" value="45">
      <output id="oTh">45.0°</output>
    </div>
    <div class="group">
      <span>靶距 D</span>
      <input id="pD" type="range" min="20" max="120" step="1" value="80">
      <output id="oD">80 m</output>
    </div>
  </div>

  <div class="paramRow">
    <div class="group">
      <span>空气阻力</span>
      <input id="pK" type="range" min="0" max="0.02" step="0.0005" value="0">
      <output id="oK">0.0000</output>
    </div>
    <div class="group">
      <span>初速波动</span>
      <input id="pSv" type="range" min="0" max="5" step="0.1" value="1">
      <output id="oSv">1.0 %</output>
    </div>
    <div class="group">
      <span>角度波动</span>
      <input id="pSth" type="range" min="0" max="2" step="0.05" value="0.3">
      <output id="oSth">0.30°</output>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     1. 物理常量与可调参数
        本模拟器统一使用真实物理单位：长度 米(m)、速度 m/s、
        角度(°)、重力加速度 m/s²。像素仅用于渲染换算，
        不参与任何物理计算（避免第 05 周 px 与 m/s² 混用的量纲问题）。
     ========================================================== */
  var G = 9.8;                       // 重力加速度 m/s²

  var V0    = 30;                    // 初速度 m/s
  var THETA = 45 * Math.PI / 180;    // 发射角 rad
  var DIST  = 80;                    // 靶距 m
  var DRAGK = 0;                     // 空气阻力系数 1/m（二次阻力）
  var SIGV  = 1.0;                   // 初速度相对波动 %
  var SIGTH = 0.3;                   // 发射角波动 °

  var TARGET_H  = 10;                // 靶心高度 m
  var RING_STEP = 1;                 // 环间距 m
  var RINGS     = 5;                 // 环数（6~10 环）
  var TARGET_R  = RINGS * RING_STEP; // 靶面外半径 m

  /* ==========================================================
     2. 仿真状态
     ========================================================== */
  var st = [0, 0, 0, 0];             // 弹丸状态 [x, y, vx, vy]
  var flying   = false;
  var flightT  = 0;                  // 本次飞行时间 s
  var apex     = 0;                  // 本次最大高度 m
  var landed   = false;              // 是否已落地
  var shotV0   = 0, shotTh = 0;      // 本次实际发射参数（含波动）

  var trail  = [];                   // 当前弹道轨迹（米）
  var ghosts = [];                   // 历史弹道残影 { pts, life }
  var GHOST_MAX = 10;

  // 散布统计
  var shots  = [];                   // 每次射击记录 { dev, ring, kind }
  var impacts = [];                  // 靶面上的弹着点高度（米），用于散布图

  /* ==========================================================
     3. 画布与视图变换（像素/米 统一比例，保证抛物线不变形）
     ========================================================== */
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;
  var view = { ppm: 10, ox: 90, oy: 0 };   // ppm=每米像素数；ox/oy=世界原点的屏幕坐标

  function wx(x) { return view.ox + x * view.ppm; }
  function wy(y) { return view.oy - y * view.ppm; }

  var VIEW_H_M = 30;                 // 竖直方向需要保证可见的高度（米）

  function layout() {
    var groundY = H - 190;                       // 地面线（底部预留控制面板）
    var mL = 90, mR = 60;
    var availW = W - mL - mR;
    var availH = groundY - 70;

    var viewW  = Math.max(DIST * 1.25, 40);      // 需看见的世界宽度（米）
    var ppmW   = availW / viewW;
    var ppmH   = availH / VIEW_H_M;

    view.ppm = Math.min(ppmW, ppmH);             // 取小者，保证靶与弹道同时可见
    view.ox  = mL;
    view.oy  = groundY;
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
  }

  /* ==========================================================
     4. 物理核心：二次空气阻力 + 四阶龙格-库塔
        x' = vx            y' = vy
        vx' = -k·|v|·vx    vy' = -g - k·|v|·vy
        k = 0 时退化为真空抛体，存在解析解（见 refreshTheory）
     ========================================================== */
  var k1 = [0,0,0,0], k2 = [0,0,0,0], k3 = [0,0,0,0], k4 = [0,0,0,0], tmp = [0,0,0,0];

  function deriv(x, y, vx, vy, out) {
    var v = Math.sqrt(vx * vx + vy * vy);
    out[0] = vx;
    out[1] = vy;
    out[2] = -DRAGK * v * vx;
    out[3] = -G - DRAGK * v * vy;
  }

  function rk4(s, h) {
    var i;
    deriv(s[0], s[1], s[2], s[3], k1);
    for (i = 0; i < 4; i++) tmp[i] = s[i] + 0.5 * h * k1[i];
    deriv(tmp[0], tmp[1], tmp[2], tmp[3], k2);
    for (i = 0; i < 4; i++) tmp[i] = s[i] + 0.5 * h * k2[i];
    deriv(tmp[0], tmp[1], tmp[2], tmp[3], k3);
    for (i = 0; i < 4; i++) tmp[i] = s[i] + h * k3[i];
    deriv(tmp[0], tmp[1], tmp[2], tmp[3], k4);
    for (i = 0; i < 4; i++) s[i] += h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
  }

  // 真空抛体解析解：射程、最大高度、全程飞行时间
  function theory(v0, th) {
    var s = Math.sin(th), c = Math.cos(th);
    return {
      range: v0 * v0 * Math.sin(2 * th) / G,
      apex:  v0 * s * v0 * s / (2 * G),
      tf:    2 * v0 * s / G
    };
  }

  /* ==========================================================
     5. 发射与飞行推进
     ========================================================== */
  function gauss() {                       // Box-Muller 标准正态
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function fire() {
    if (flying) return;

    // 模拟装药量波动与发射抖动
    shotV0 = V0 * (1 + gauss() * SIGV / 100);
    shotTh = THETA + gauss() * SIGTH * Math.PI / 180;
    if (shotTh < 0) shotTh = 0;
    if (shotTh > Math.PI / 2) shotTh = Math.PI / 2;

    st[0] = 0;  st[1] = 0;
    st[2] = shotV0 * Math.cos(shotTh);
    st[3] = shotV0 * Math.sin(shotTh);

    flying = true; landed = false;
    flightT = 0; apex = 0;
    trail = [];
    st._shot = { y: null, dev: null, ring: 0, landX: null };   // 本次射击记录
    document.getElementById('btnFire').disabled = true;
  }

  var H_STEP = 0.0005;                 // 固定积分步长 s

  function advance(dt) {
    if (!flying) return;
    var n = Math.ceil(dt / H_STEP);
    if (n > 4000) n = 4000;
    var h = dt / n;

    for (var i = 0; i < n; i++) {
      var px = st[0], py = st[1];
      rk4(st, h);
      flightT += h;

      if (st[1] > apex) apex = st[1];

      // 采样轨迹（按世界距离阈值，避免冗余点）
      var last = trail.length ? trail[trail.length - 1] : null;
      if (!last || (st[0] - last[0]) * (st[0] - last[0]) + (st[1] - last[1]) * (st[1] - last[1]) > 0.02) {
        trail.push([st[0], st[1]]);
        if (trail.length > 4000) trail.shift();
      }

      // ---- 事件判定：靶面穿越 与 落地，按 x 先后取先发生者 ----
      var evBoard = null, evGround = null;

      if (px < DIST && st[0] >= DIST) {
        var fb = (DIST - px) / (st[0] - px);
        evBoard = { x: DIST, y: py + fb * (st[1] - py), f: fb };
      }
      // 这里必须用 py >= 0：发射角恰为 0 时，首步 py 就等于 0，
      // 若写成 py > 0 则落地判定永远不成立，弹丸会一直下坠到 90 s 超时。
      if (py >= 0 && st[1] <= 0 && st[3] < 0) {
        var fg = py / (py - st[1]);
        evGround = { x: px + fg * (st[0] - px), y: 0, f: fg };
      }

      if (evBoard && (!evGround || evBoard.x <= evGround.x)) {
        onBoard(evBoard.y);
        if (Math.abs(evBoard.y - TARGET_H) <= TARGET_R) {   // 命中靶面则停止
          // 用事件在步内的插值比例回算时刻，否则飞行时间会被量化到步长边界
          flightT = (flightT - h) + evBoard.f * h;
          flying = false;
          break;
        }
      }
      if (evGround && (!evBoard || evGround.x < evBoard.x)) {
        onGround(evGround.x);
        flightT = (flightT - h) + evGround.f * h;           // 同上
        landed = true;
        flying = false;
        break;
      }
      if (flightT > 90) { flying = false; break; }          // 安全兜底
    }

    if (!flying) {
      finalizeShot();
      document.getElementById('btnFire').disabled = false;
      ghosts.push({ pts: trail.slice(), life: 1 });
      if (ghosts.length > GHOST_MAX) ghosts.shift();
    }
  }

  function ringOf(dev) {
    var r = Math.abs(dev);
    if (r > TARGET_R) return 0;
    var k = Math.max(1, Math.ceil(r / RING_STEP));
    return 11 - k;                       // 半径 ≤1m → 10 环，≤2m → 9 环 ...
  }

  // 记录"穿过靶面"事件（同一发只记一次）
  function onBoard(yCross) {
    var s = st._shot;
    if (!s || s.y !== null) return;
    s.y   = yCross;
    s.dev = yCross - TARGET_H;
    s.ring = ringOf(s.dev);
  }

  // 记录"落地"事件。注意：从靶面上方飞过、或未命中靶面的弹丸会继续飞行，
  // 最终也要走到这里，因此实际射程不会因为已经穿过靶面而被丢掉。
  function onGround(xLand) {
    var s = st._shot;
    if (!s || s.landX !== null) return;
    s.landX = xLand;
  }

  // 一发结束后结算：每次射击恰好产生一条统计记录，杜绝重复计数
  function finalizeShot() {
    var s = st._shot;
    if (!s) return;
    shots.push({ dev: s.dev, ring: s.ring, landX: s.landX });
    if (s.y !== null) impacts.push(s.y);
    st._result = s;
    st._shot = null;
  }

  /* ==========================================================
     6. 渲染
     ========================================================== */
  function drawBackground() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(120,180,255,.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < W; x += 44) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (var y = 0; y < H; y += 44) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
  }

  function drawGround() {
    var gy = wy(0);

    // 地平线
    ctx.save();
    var g = ctx.createLinearGradient(0, gy, W, gy);
    g.addColorStop(0,   'rgba(120,180,255,.10)');
    g.addColorStop(0.5, 'rgba(120,180,255,.45)');
    g.addColorStop(1,   'rgba(120,180,255,.10)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, gy + .5);
    ctx.lineTo(W, gy + .5);
    ctx.stroke();

    // 地面填充
    var gf = ctx.createLinearGradient(0, gy, 0, H);
    gf.addColorStop(0, 'rgba(78,168,255,.055)');
    gf.addColorStop(1, 'rgba(78,168,255,0)');
    ctx.fillStyle = gf;
    ctx.fillRect(0, gy, W, H - gy);

    // 距离刻度
    ctx.fillStyle = 'rgba(107,122,146,.85)';
    ctx.font = '11px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var stepM = DIST > 90 ? 20 : 10;
    for (var m = stepM; m <= DIST * 1.3; m += stepM) {
      var sx = wx(m);
      if (sx < 40 || sx > W - 20) continue;
      ctx.strokeStyle = 'rgba(120,180,255,.20)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx + .5, gy);
      ctx.lineTo(sx + .5, gy + 7);
      ctx.stroke();
      ctx.fillText(m + 'm', sx, gy + 10);
    }
    ctx.restore();
  }

  function drawCannon() {
    var cx = wx(0), cy = wy(0);
    var len = 34;

    ctx.save();
    // 基座
    ctx.fillStyle = 'rgba(78,168,255,.20)';
    ctx.strokeStyle = 'rgba(120,180,255,.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // 炮管（随发射角旋转；屏幕 y 向下，故取负角）
    ctx.translate(cx, cy);
    ctx.rotate(-THETA);
    var bg = ctx.createLinearGradient(0, -4, len, 4);
    bg.addColorStop(0, 'rgba(150,195,255,.55)');
    bg.addColorStop(1, 'rgba(255,154,80,.90)');
    ctx.strokeStyle = bg;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(len, 0);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,190,140,.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(len, 0);
    ctx.lineTo(len, 0);
    ctx.stroke();
    ctx.restore();

    // 炮口发光
    ctx.save();
    ctx.shadowColor = 'rgba(255,154,80,.9)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255,190,140,.95)';
    ctx.beginPath();
    ctx.arc(wx(0) + Math.cos(THETA) * len, wy(0) - Math.sin(THETA) * len, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTarget() {
    var bx = wx(DIST), by = wy(TARGET_H);
    var R  = TARGET_R * view.ppm;

    ctx.save();

    // 支柱
    ctx.strokeStyle = 'rgba(120,180,255,.30)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx, wy(0));
    ctx.lineTo(bx, by + R);
    ctx.stroke();

    // 靶面（由外向内，交替填充）
    for (var i = RINGS; i >= 1; i--) {
      var r = i * RING_STEP * view.ppm;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fillStyle = (i % 2 === 0) ? 'rgba(78,168,255,.055)' : 'rgba(78,168,255,.12)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,180,255,.38)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 靶心
    ctx.beginPath();
    ctx.arc(bx, by, Math.max(2.5, 0.35 * view.ppm), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(126,240,208,.55)';
    ctx.fill();

    // 十字准线
    ctx.strokeStyle = 'rgba(120,180,255,.30)';
    ctx.beginPath();
    ctx.moveTo(bx - R - 9, by + .5); ctx.lineTo(bx + R + 9, by + .5);
    ctx.moveTo(bx + .5, by - R - 9); ctx.lineTo(bx + .5, by + R + 9);
    ctx.stroke();

    // 标签
    ctx.fillStyle = 'rgba(126,240,208,.75)';
    ctx.font = '11px Consolas, "Microsoft YaHei", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('靶心 ' + TARGET_H + ' m  ·  ' + DIST + ' m', bx, by - R - 14);

    // ---- 弹着散布图：历史命中点 ----
    for (var j = 0; j < impacts.length; j++) {
      var iy = wy(impacts[j]);
      var hitRing = Math.abs(impacts[j] - TARGET_H) <= TARGET_R;
      ctx.beginPath();
      ctx.arc(bx, iy, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = hitRing ? 'rgba(255,154,80,.92)' : 'rgba(255,90,90,.75)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGhosts() {
    for (var i = 0; i < ghosts.length; i++) {
      var gh = ghosts[i];
      var t = (i + 1) / ghosts.length;                 // 越新越亮
      var a = 0.04 + t * 0.16;
      if (gh.pts.length < 2) continue;

      ctx.save();
      ctx.strokeStyle = 'rgba(90,140,200,' + a.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wx(gh.pts[0][0]), wy(gh.pts[0][1]));
      for (var j = 1; j < gh.pts.length; j++) {
        ctx.lineTo(wx(gh.pts[j][0]), wy(gh.pts[j][1]));
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  // 当前弹道：越靠近弹丸越亮，形成"轨迹残影"
  function drawTrail() {
    if (trail.length < 2) return;
    var n = trail.length;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 1; i < n; i++) {
      var t = i / n;
      var p = trail[i - 1], q = trail[i];
      ctx.strokeStyle = 'rgba(126,240,208,' + (0.05 + t * t * 0.75).toFixed(3) + ')';
      ctx.lineWidth = 0.8 + t * 2.6;
      ctx.beginPath();
      ctx.moveTo(wx(p[0]), wy(p[1]));
      ctx.lineTo(wx(q[0]), wy(q[1]));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawProjectile() {
    if (!flying) return;
    var px = wx(st[0]), py = wy(st[1]);

    ctx.save();
    var halo = ctx.createRadialGradient(px, py, 1, px, py, 22);
    halo.addColorStop(0,   'rgba(255,190,140,.42)');
    halo.addColorStop(0.45,'rgba(255,154,80,.16)');
    halo.addColorStop(1,   'rgba(255,154,80,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(px, py, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = 'rgba(255,180,120,.95)';
    ctx.shadowBlur = 18;
    var body = ctx.createRadialGradient(px - 1.6, py - 1.8, 0.6, px, py, 6);
    body.addColorStop(0,   '#fffdf8');
    body.addColorStop(0.4, '#ffd9a8');
    body.addColorStop(1,   '#ff9a50');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAim() {
    if (flying) return;
    var cx = wx(0), cy = wy(0);
    var len = 52;
    var ex = cx + Math.cos(THETA) * len;
    var ey = cy - Math.sin(THETA) * len;

    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(255,154,80,.62)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.restore();

    // 角度标注
    ctx.save();
    ctx.strokeStyle = 'rgba(126,240,208,.55)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(cx, cy, 40, -THETA, 0);
    ctx.stroke();

    ctx.fillStyle = 'rgba(126,240,208,.9)';
    ctx.font = '12px Consolas, "Microsoft YaHei", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((THETA * 180 / Math.PI).toFixed(1) + '°',
                 cx + Math.cos(THETA / 2) * 56,
                 cy - Math.sin(THETA / 2) * 56);
    ctx.restore();
  }

  function render() {
    drawBackground();
    drawGround();
    drawGhosts();
    drawTrail();
    drawTarget();
    drawCannon();
    drawAim();
    drawProjectile();
  }

  /* ==========================================================
     7. 数据面板
     ========================================================== */
  var el = {
    v0:    document.getElementById('v-v0'),
    theta: document.getElementById('v-theta'),
    D:     document.getElementById('v-D'),
    k:     document.getElementById('v-k'),
    r0:    document.getElementById('v-r0'),
    t:     document.getElementById('v-t'),
    apex:  document.getElementById('v-apex'),
    range: document.getElementById('v-range'),
    state: document.getElementById('v-state'),
    n:     document.getElementById('v-n'),
    rate:  document.getElementById('v-rate'),
    mu:    document.getElementById('v-mu'),
    sigma: document.getElementById('v-sigma'),
    best:  document.getElementById('v-best')
  };

  function updateHUD() {
    var th = theory(V0, THETA);

    el.v0.textContent    = V0.toFixed(1) + ' m/s';
    el.theta.textContent = (THETA * 180 / Math.PI).toFixed(1) + '°';
    el.D.textContent     = DIST + ' m';
    el.k.textContent     = DRAGK.toFixed(4);
    el.r0.textContent    = th.range.toFixed(2) + ' m';
    el.t.textContent     = flightT.toFixed(2) + ' s';
    el.apex.textContent  = apex.toFixed(2) + ' m';

    // 实际射程：已落地就取落点，未落地（命中靶面后弹丸停在靶上）则取靶距
    var res = st._result;
    if (flying) {
      el.range.textContent = '—';
      el.state.textContent = '飞行中…';
      el.state.className   = 'v';
    } else if (!res) {
      el.range.textContent = '—';
      el.state.textContent = '待发射';
      el.state.className   = 'v';
    } else {
      el.range.textContent = (res.landX !== null)
        ? res.landX.toFixed(1) + ' m'
        : DIST + ' m（靶面）';

      if (res.ring > 0) {
        el.state.textContent = '命中 ' + res.ring + ' 环';
        el.state.className   = 'v hit';
      } else if (res.y === null) {
        el.state.textContent = '脱靶 · 射程不足';
        el.state.className   = 'v';
      } else {
        el.state.textContent = '脱靶 · ' + (res.dev > 0 ? '偏高' : '偏低');
        el.state.className   = 'v';
      }
    }

    // 散布统计
    var n = shots.length;
    el.n.textContent = n;
    if (n === 0) {
      el.rate.textContent = '—';
      el.mu.textContent   = '—';
      el.sigma.textContent = '—';
      el.best.textContent = '—';
      return;
    }

    var hits = 0, devs = [], best = 0;
    for (var i = 0; i < n; i++) {
      if (shots[i].ring > 0) hits++;
      if (shots[i].dev !== null) devs.push(shots[i].dev);
      if (shots[i].ring > best) best = shots[i].ring;
    }
    el.rate.textContent = (hits / n * 100).toFixed(1) + ' %';
    el.best.textContent = best > 0 ? best + ' 环' : '未命中';

    if (devs.length === 0) {
      el.mu.textContent = '—';
      el.sigma.textContent = '—';
    } else {
      var sum = 0;
      for (i = 0; i < devs.length; i++) sum += devs[i];
      var mu = sum / devs.length;
      var ss = 0;
      for (i = 0; i < devs.length; i++) ss += (devs[i] - mu) * (devs[i] - mu);
      var sd = Math.sqrt(ss / devs.length);
      el.mu.textContent    = (mu >= 0 ? '+' : '') + mu.toFixed(2) + ' m';
      el.sigma.textContent = sd.toFixed(2) + ' m';
    }
  }

  /* ==========================================================
     8. 主循环
     ========================================================== */
  var lastFrame = performance.now();

  function loop(now) {
    var realDt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (realDt > 0.1) realDt = 0.1;          // 切换标签页后避免大跳

    advance(realDt);
    render();
    updateHUD();
    requestAnimationFrame(loop);
  }

  /* ==========================================================
     9. 交互
     ========================================================== */
  var aiming = false;

  function setAngleFromPointer(cx, cy) {
    var dx = cx - wx(0);
    var dy = wy(0) - cy;                      // 屏幕上方向为世界 +y
    if (dx < 1) dx = 1;
    var a = Math.atan2(dy, dx);
    if (a < 0) a = 0;
    var lim = 85 * Math.PI / 180;
    if (a > lim) a = lim;
    THETA = a;
    pTh.value = (a * 180 / Math.PI).toFixed(1);   // 同步滑块
    oTh.textContent = (a * 180 / Math.PI).toFixed(1) + '°';
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (flying) return;
    aiming = true;
    canvas.classList.add('aiming');
    canvas.setPointerCapture(e.pointerId);
    setAngleFromPointer(e.clientX, e.clientY);
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!aiming) return;
    setAngleFromPointer(e.clientX, e.clientY);
  });

  canvas.addEventListener('pointerup', function () {
    if (!aiming) return;
    aiming = false;
    canvas.classList.remove('aiming');
    fire();                                   // 松开即发射
  });
  canvas.addEventListener('pointercancel', function () {
    aiming = false;
    canvas.classList.remove('aiming');
  });

  document.getElementById('btnFire').addEventListener('click', fire);

  document.getElementById('btnClear').addEventListener('click', function () {
    shots = []; impacts = []; ghosts = []; trail = [];
    st._result = null;
    flightT = 0; apex = 0;
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); fire(); }
    else if (e.code === 'KeyC') {
      shots = []; impacts = []; ghosts = []; trail = [];
      st._result = null; flightT = 0; apex = 0;
    }
  });

  window.addEventListener('resize', resize);

  /* ---------- 参数滑块 ---------- */
  function bindSlider(id, outId, fmt, apply) {
    var input = document.getElementById(id);
    var out   = document.getElementById(outId);
    function sync() {
      var v = Number(input.value);
      apply(v);
      out.textContent = fmt(v);
    }
    input.addEventListener('input', sync);
    sync();
    return input;
  }

  var pTh = bindSlider('pTh', 'oTh', function (v) { return v.toFixed(1) + '°'; },
                       function (v) { THETA = v * Math.PI / 180; });
  bindSlider('pV0', 'oV0', function (v) { return v.toFixed(1) + ' m/s'; },
             function (v) { V0 = v; });
  bindSlider('pD', 'oD', function (v) { return v + ' m'; },
             function (v) { DIST = v; impacts = []; layout(); });
  bindSlider('pK', 'oK', function (v) { return v.toFixed(4); },
             function (v) { DRAGK = v; });
  bindSlider('pSv', 'oSv', function (v) { return v.toFixed(1) + ' %'; },
             function (v) { SIGV = v; });
  bindSlider('pSth', 'oSth', function (v) { return v.toFixed(2) + '°'; },
             function (v) { SIGTH = v; });

  /* ==========================================================
     10. 启动
     ========================================================== */
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
